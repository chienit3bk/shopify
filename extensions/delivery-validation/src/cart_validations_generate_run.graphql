query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  cart {
    # Same key as scripts/delivery-date-config.json (attributeKey); set by the delivery-date block.
    deliveryDate: attribute(key: "Delivery date") {
      value
    }
    deliveryGroups {
      deliveryAddress {
        address1
        address2
      }
      selectedDeliveryOption {
        title
      }
      cartLines {
        merchandise {
          __typename
          ... on ProductVariant {
            product {
              title
              # True on items the carrier can't take to a PO Box, whichever option is chosen.
              noPoBox: metafield(namespace: "custom", key: "no_po_box") {
                jsonValue
              }
            }
          }
        }
      }
    }
  }
  shop {
    localTime {
      date
    }
    cutoff: metafield(key: "shipping_cutoff_config") {
      jsonValue
    }
    config: metafield(key: "delivery_date_config") {
      jsonValue
    }
  }
}
