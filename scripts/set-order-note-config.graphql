# Writes scripts/order-note-config.json to the app-owned shop metafield read by the order-note block.
# shopify app execute --store <shop> --query-file scripts/set-order-note-config.graphql --variable-file <vars.json>
mutation SetOrderNoteConfig($shopId: ID!, $config: String!) {
  metafieldsSet(metafields: [{ownerId: $shopId, namespace: "$app", key: "order_note_config", type: "json", value: $config}]) {
    metafields { key updatedAt }
    userErrors { field message }
  }
}
