# Writes scripts/address-rules-config.json to the app-owned shop metafield (address-validation Function).
# shopify app execute --store <shop> --query-file scripts/set-address-rules-config.graphql --variable-file <vars.json>
mutation SetAddressRulesConfig($shopId: ID!, $config: String!) {
  metafieldsSet(metafields: [{ownerId: $shopId, namespace: "$app", key: "address_rules_config", type: "json", value: $config}]) {
    metafields { key updatedAt }
    userErrors { field message }
  }
}
