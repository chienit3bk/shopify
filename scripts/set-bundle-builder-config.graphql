# Writes scripts/bundle-builder-config.json to the app-owned shop metafield (bundle-expand Function
# + the "Build your own bundle" product page block).
# shopify app execute --store <shop> --query-file scripts/set-bundle-builder-config.graphql --variable-file <vars.json>
mutation SetBundleBuilderConfig($shopId: ID!, $config: String!) {
  metafieldsSet(metafields: [{ownerId: $shopId, namespace: "$app", key: "bundle_builder", type: "json", value: $config}]) {
    metafields { key updatedAt }
    userErrors { field message }
  }
}
